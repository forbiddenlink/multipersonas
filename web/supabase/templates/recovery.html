<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Reset your Personaudit password</title>
  </head>
  <body>
    <h1>Reset your Personaudit password</h1>
    <p>Use this link to choose a new password for your Personaudit account.</p>
    <p><a href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&amp;type=recovery&amp;next=/auth/update-password">Reset password</a></p>
    <p>If you didn’t request this, you can ignore this email.</p>
  </body>
</html>
