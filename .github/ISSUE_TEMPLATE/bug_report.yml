name: Bug report
description: Something in the CLI, the GitHub Action, or the web app does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For security problems, do not file here. Use the private report link in the issue chooser (see SECURITY.md).
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `npx personaudit --version`, or the action ref.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command or workflow
      description: The exact command you ran. Replace secrets and private URLs.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Paste the output and the exit code. Do not paste session files or cookies.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, Node version, and whether this runs locally or in CI.
