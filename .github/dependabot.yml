version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/web"
      - "/worker"
      - "/video"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    cooldown:
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      patch-and-minor:
        patterns: ["*"]
        update-types: ["patch", "minor"]
      major-updates:
        patterns: ["*"]
        update-types: ["major"]
    ignore:
      # eslint 10 is blocked upstream, not by us: eslint-config-next (Next 16)
      # pulls eslint-plugin-react@7.37.5, which peers eslint "<=9.7" and crashes
      # on eslint 10's removed context.getFilename API (web lint exits 2). Left
      # in the major group it poisons the whole grouped PR. Hold the eslint major
      # (and @eslint/js, versioned in lockstep) until eslint-config-next ships
      # eslint-10 support, then bump manually and remove this ignore.
      - dependency-name: "eslint"
        versions: [">=10"]
      - dependency-name: "@eslint/js"
        versions: [">=10"]
      # typescript 7 breaks two things at once, confirmed by PR #45's CI (all of
      # CI/E2E/a11y-dogfood failed on this alone, 2026-08-11): typescript-eslint
      # 8.65.0 hard-errors ("does not support TS 7.0") so `eslint .` exits 2, and
      # Next.js 16.2.12's `next build`/`next dev` can't use TS 7's compiler API
      # ("does not provide the compiler API required by Next.js"). Left in the
      # major group it poisons the whole grouped PR the same way eslint 10 did.
      # Hold until typescript-eslint + Next.js both support TS 7, then bump
      # manually and remove this ignore.
      - dependency-name: "typescript"
        versions: [">=7"]
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps):"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps):"
