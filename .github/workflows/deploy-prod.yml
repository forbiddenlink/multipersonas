name: Deploy production (manual)

# ⚠️ THIS IS NOT A GATE. A push to `main` IS live: Vercel's git integration deploys it
# automatically (reconnected 2026-08-02; detail in git history for the now-removed
# docs/audit-2026-08-02.md). An earlier version of
# this comment claimed "a push to main is not live until someone deploys" — that was true
# before the reconnect and is false now. Do not read this workflow as protecting production.
#
# What it is instead: the *verified* deploy path. The git-integration deploy skips
# scripts/check-prod-env.mjs and scripts/prod-smoke.mjs; this run does both. Use it to
# re-deploy deliberately after an env change, or to confirm prod is healthy. Adding required
# reviewers to the `production` environment gates THIS path only — it cannot gate a push.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm a PRODUCTION deploy of web/'
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.inputs.confirm == 'deploy' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      # Vercel CLI reads these from the environment — never pass --token on argv (it leaks
      # into logs). Set all three in repo Settings → Secrets/Variables → Actions.
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Pull Vercel production env
        run: pnpm dlx vercel@latest pull --yes --environment=production
      - name: Check production env
        run: node scripts/check-prod-env.mjs --prod --env-path .vercel/.env.production.local
      - name: Build
        run: pnpm dlx vercel@latest build --prod
      - name: Deploy prebuilt to production
        run: pnpm dlx vercel@latest deploy --prebuilt --prod
      - name: Smoke production
        run: node scripts/prod-smoke.mjs
