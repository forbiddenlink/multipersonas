name: Dependabot lockfile resync

# Dependabot regenerates pnpm-lock.yaml without the `overrides:` block that
# package.json declares, so `pnpm install --frozen-lockfile` then aborts with
# ERR_PNPM_LOCKFILE_CONFIG_MISMATCH and the PR can never go green. This puts the
# block back and pushes the corrected lockfile to the PR branch.
#
# pull_request_target is needed to get a token that can push. Safe here: the job
# only runs for dependabot's own in-repo `dependabot/*` branches, checks out the gated
# commit SHA with no stored credentials, and `--lockfile-only --ignore-scripts` resolves
# the manifest without executing package install scripts. The push token exists only in
# the final step.

on: pull_request_target

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  resync:
    # All three must hold: dependabot authored it, it lives in this repo (not a fork),
    # and it is on a dependabot/ branch.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'dependabot/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the pull request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Pin to the exact commit that was gated, not the moving branch name.
          ref: ${{ github.event.pull_request.head.sha }}
          # No credential stays in .git/config while `pnpm install` runs on the PR's
          # manifest. The PAT is used only in the push step below.
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Resync the lockfile against package.json
        id: resync
        run: |
          set -uo pipefail
          before=$(sha256sum pnpm-lock.yaml | cut -d' ' -f1)
          pnpm install --lockfile-only --ignore-scripts
          after=$(sha256sum pnpm-lock.yaml | cut -d' ' -f1)
          if [ "$before" = "$after" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify a frozen install now succeeds
        if: steps.resync.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile --lockfile-only

      - name: Push the corrected lockfile
        if: steps.resync.outputs.changed == 'true'
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          REPO: ${{ github.repository }}
          # A PAT makes the pushed commit retrigger CI. With the default GITHUB_TOKEN the
          # push lands but its workflow runs sit at action_required until someone approves.
          PUSH_TOKEN: ${{ secrets.AUTOMATION_TOKEN || github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "fix(deps): resync pnpm-lock.yaml with package.json overrides"
          auth=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push "https://github.com/$REPO.git" "HEAD:refs/heads/$HEAD_REF"
