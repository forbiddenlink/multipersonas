name: a11y dogfood

# Personaudit scans its own public pages with the same axe ruleset it judges other
# sites by. An accessibility tool must not ship accessibility defects — this fails the
# build on any violation, in both themes. See scripts/axe-dogfood.mjs.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dogfood:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Public pages instantiate a Supabase client on render (auth forms), which throws
    # when these are absent — crashing every scanned route. The dogfood only audits
    # rendered markup, so non-secret placeholders are sufficient: the client constructs,
    # no real backend is contacted.
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build web
        working-directory: web
        run: pnpm build

      - name: Start app and run the a11y dogfood
        env:
          DOGFOOD_URL: http://localhost:3000
        run: |
          (cd web && pnpm exec next start -p 3000 &)
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/ >/dev/null 2>&1 && { echo "app ready"; break; }
            sleep 1
          done
          node scripts/axe-dogfood.mjs
