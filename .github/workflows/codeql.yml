name: CodeQL

# Advanced setup, not default setup. The repo owner's token has no
# security_events scope, so PUT /code-scanning/default-setup returns 404.
# A workflow needs no such scope: GITHUB_TOKEN carries security-events: write
# for the job below, and CodeQL is free on a public repository.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 7 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # `actions` scans the workflow files themselves. Every other language
        # GitHub offers here (python) has no source in this repo.
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No build step: CodeQL extracts JS/TS and workflow YAML directly, so the
      # pnpm workspace never has to install to be analysed.
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: ${{ matrix.language }}
          # No `queries:` input, so this runs the `default` suite - the same one
          # default setup reports (`query_suite: default`). security-extended is
          # deliberately not used: semgrep already runs advisory-only here, and a
          # second noisy scanner buries the findings worth acting on.
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: /language:${{ matrix.language }}
