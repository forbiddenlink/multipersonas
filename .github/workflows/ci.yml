name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: CI only reads the code. No token should be able to write.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (CLI)
        run: pnpm lint

      - name: Lint
        working-directory: web
        run: pnpm lint

      - name: Type check (CLI)
        run: pnpm exec tsc --noEmit

      - name: Type check (web)
        working-directory: web
        run: pnpm exec tsc --noEmit

      - name: Type check (worker)
        working-directory: worker
        run: pnpm typecheck

      - name: Test (CLI)
        run: pnpm test

      - name: Test (web)
        working-directory: web
        run: pnpm test

      # Catches build-only breaks (Satori/ImageResponse, RSC boundaries, Next 16
      # config) that tsc + tests miss — hand-run every session, now gated in CI.
      - name: Build (web)
        working-directory: web
        run: pnpm build

      # Dependency advisories are handled by Dependabot (active on this repo),
      # not here: npm retired the `pnpm audit` REST endpoint (410 Gone), so the
      # step failed on the dead endpoint rather than on real vulnerabilities.
