name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: CI only reads the code. No token should be able to write.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (CLI)
        run: pnpm lint

      - name: Lint
        working-directory: web
        run: pnpm lint

      - name: Type check (CLI)
        run: pnpm exec tsc --noEmit

      - name: Type check (web)
        working-directory: web
        run: pnpm exec tsc --noEmit

      - name: Build (CLI)
        run: pnpm build

      - name: Type check (worker)
        working-directory: worker
        run: pnpm typecheck

      # Tests are excluded from the build tsconfig; typecheck them separately so
      # agent-authored test drift (stale fixtures against changed types) is caught.
      - name: Type check (CLI tests)
        run: pnpm exec tsc --noEmit -p tsconfig.test.json

      - name: Test (CLI)
        run: pnpm test

      - name: Install Chromium for browser-condition regression tests
        run: pnpm exec playwright install --with-deps chromium

      - name: Test enforced browser conditions
        run: pnpm test:browser

      - name: Test (web)
        working-directory: web
        run: pnpm test

      # Catches build-only breaks (Satori/ImageResponse, RSC boundaries, Next 16
      # config) that tsc + tests miss — hand-run every session, now gated in CI.
      - name: Build (web)
        working-directory: web
        run: pnpm build

      - name: Check bundle budget
        run: pnpm check:bundle

      # Dependency advisories are handled by Dependabot (active on this repo),
      # not here: npm retired the `pnpm audit` REST endpoint (410 Gone), so the
      # step failed on the dead endpoint rather than on real vulnerabilities.
