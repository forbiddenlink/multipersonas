name: Worker image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check credential exclusions with synthetic files
        run: bash scripts/test-docker-context.sh

      - name: Build worker image
        run: docker build -t personaudit-worker:test -f worker/Dockerfile .

      - name: Verify worker runtime imports
        run: >-
          docker run --rm --network none --entrypoint pnpm personaudit-worker:test
          --filter worker exec tsx --eval
          'void (async () => {
          await import("personaudit/orchestrator");
          await import("personaudit/grader");
          await import("./src/job-process.ts");
          })();'
