name: Worker image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Harden runner (audit egress)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check credential exclusions with synthetic files
        run: bash scripts/test-docker-context.sh

      - name: Build worker image
        run: docker build -t personaudit-worker:test -f worker/Dockerfile .

      - name: Verify worker runtime imports
        run: >-
          docker run --rm --network none --entrypoint pnpm personaudit-worker:test
          --filter worker exec tsx --eval
          'void (async () => {
          await import("personaudit/orchestrator");
          await import("personaudit/grader");
          await import("./src/job-process.ts");
          })();'

      # SEC-001: through the real entrypoint, prove the scan and a browser-position descendant
      # run as a separate, capability-free uid and cannot find a canary service-role key in any
      # process. The key value is a per-run canary, never a real key.
      - name: Verify scan uid isolation
        run: >-
          docker run --rm --network none
          -e MP_SCAN_ISOLATION_TESTS=1 -e SUPABASE_SERVICE_ROLE_KEY="canary-${GITHUB_RUN_ID}"
          personaudit-worker:test /usr/local/bin/entrypoint.sh
          pnpm exec vitest run --configLoader runner worker/src/scan-isolation.container.test.ts
