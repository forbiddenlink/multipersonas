name: Publish to npm

# Publishes the root `personaudit` package with a provenance attestation, so the npm
# tarball is verifiably built from this repo by this workflow (npm shows the "Built and
# signed on GitHub Actions" badge). Before this workflow existed, 0.1.0 was published from
# a local machine and has no attestation.
#
# Triggers: publishing a GitHub release, or a manual run that types "publish".
# Adding required reviewers to the `npm` environment gates both paths.
#
# Auth is npm trusted publishing (OIDC): no NPM_TOKEN secret exists to leak. One-time
# setup by a package owner (npm login with 2FA, npm >= 11.15):
#   npm trust github personaudit --repo forbiddenlink/multipersonas --file publish-npm.yml --env npm --allow-publish
# Trusted publishing needs npm >= 11.5.1, which Node 24 bundles. Bump `version` in
# package.json first; npm rejects a version that already exists.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to confirm an npm publish of personaudit'
        required: true

permissions:
  contents: read

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name == 'release' || github.event.inputs.confirm == 'publish' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      id-token: write # npm provenance (OIDC)
    steps:
      - name: Harden runner (audit egress)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # No dependency cache in a release job: a poisoned cache could reach the tarball.
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Type check (tests)
        run: pnpm exec tsc --noEmit -p tsconfig.test.json

      # Build first, as ci.yml does: the worker tests import the built CLI from dist/.
      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Publish with provenance (trusted publishing)
        run: npm publish --provenance --access public
