name: E2E (gated app)

# Playwright coverage for the auth-gated surfaces (dashboard, projects, audit
# report) against a LOCAL Supabase stack — no cloud project, no secrets. The
# stack is booted with `supabase start`, seeded with a test user + owned data,
# and the specs sign in through the real login form (cookie auth).
#
# This is intentionally its OWN workflow, separate from ci.yml: it needs Docker +
# a full Supabase boot (~minutes) and is heavier/flakier than the unit gate. Do
# NOT mark it a required status check in branch protection until it has proven
# green + non-flaky across several runs — that is the "non-blocking until proven"
# safety valve. ci.yml stays the fast gate that blocks main.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # manual trigger for de-flaking runs

# Least privilege: only reads the code.
permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser (chromium)
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium

      # Pinned to the version used locally so a CLI bump never silently changes
      # local-stack behaviour under us.
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1
        with:
          version: 2.109.1

      - name: Start local Supabase stack
        working-directory: web
        run: supabase start

      # run.sh: pulls the local stack's URL + keys from `supabase status`, seeds
      # the test user + owned data, then runs Playwright. The config's webServer
      # boots `next dev` inheriting that env.
      - name: Run gated-app E2E
        working-directory: web
        run: pnpm test:e2e

      - name: Stop local Supabase stack
        if: always()
        working-directory: web
        run: supabase stop || true

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
